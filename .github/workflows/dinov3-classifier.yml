name: Convert DINOv3 Classifier to OM

on:
  workflow_dispatch:

jobs:
  onnx2om:
    runs-on: ubuntu-22.04
    container:
      image: kaylor/atc
      options: --privileged

    steps:
    - name: Download classifier backbone
      shell: bash
      run: |
        set -eo pipefail
        apt-get update
        apt-get install -y wget
        mkdir -p om

        wget -O om/backbone_opset17_static_b32.onnx \
          https://github.com/MelanTech/model_convert/releases/download/dinov3s-classifier-input/backbone_opset17_static_b32.onnx
        echo "20a4983d3c709219e6b0076f022947c5e404e00ddf99ff59c2ac956d27bcb9e0  om/backbone_opset17_static_b32.onnx" \
          | sha256sum --check

    - name: Convert classifier backbone
      shell: bash
      working-directory: om
      run: |
        set -eo pipefail
        source /usr/local/Ascend/ascend-toolkit/set_env.sh
        export LD_LIBRARY_PATH=/usr/local/Ascend/ascend-toolkit/latest/x86_64-linux/devlib/:$LD_LIBRARY_PATH
        export TE_PARALLEL_COMPILER=2

        atc --model=backbone_opset17_static_b32.onnx \
            --framework=5 \
            --output=backbone \
            --input_format=NCHW \
            --input_shape="pixel_values:32,3,224,224" \
            --soc_version=Ascend310B4 \
            --precision_mode=allow_mix_precision

        test -s backbone.om
        ls -lh backbone.om

    - name: Upload OM artifact
      uses: actions/upload-artifact@v4
      with:
        name: dinov3s-classifier-om
        path: om/backbone.om
        if-no-files-found: error
